name = "sa-websocket"
main = "src/index.ts"
compatibility_date = "2024-09-02"
compatibility_flags = ["nodejs_compat"]


# Define the Broadcaster Durable Object
[[durable_objects.bindings]]
name = "BROADCASTER"
class_name = "Broadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Broadcaster"]

[observability.logs]
enabled = true

# Environment variables (set via wrangler secret or dashboard)
# These should be set as secrets, not in this file:
#   wrangler secret put DATABASE_URL
#   wrangler secret put SUPERATOM_SERVICE_KEY
#   wrangler secret put JWT_SECRET
#
# DATABASE_URL: Your Neon PostgreSQL connection string
# SUPERATOM_SERVICE_KEY: Master key for API key management endpoints
# JWT_SECRET: Browser session verification. MUST be byte-identical to the
#   sa-api worker's JWT_SECRET — sa-api signs, this worker verifies. A mismatch
#   rejects every browser connection once WS_AUTH_ENFORCE is on.

[vars]
# Rollout gate for browser (runtime/admin) session auth.
# "false" = verify and log the outcome, but still allow the connection through.
# "true"  = reject unauthenticated / cross-org browser connections.
# Deploy with "false", confirm the logs are clean, then flip to "true".
WS_AUTH_ENFORCE = "true"

# Optional: KV namespaces (if you need them later)
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "your-kv-namespace-id"

# Optional: R2 buckets (if you need them later)
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "your-bucket-name"