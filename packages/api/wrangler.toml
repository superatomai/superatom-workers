name = "sa-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sa-assets"
# LOCAL TESTING ONLY — do not commit. Lets `wrangler dev --remote` use the real
# bucket. Remove before pushing.
# preview_bucket_name = "sa-assets"

# Private bucket for client-uploaded source files (Excel/CSV).
# No public domain — all access mediated by signed URLs from this worker.
# Create with: wrangler r2 bucket create sa-source-files
[[r2_buckets]]
binding = "R2_SOURCE_FILES"
bucket_name = "sa-source-files"
# LOCAL TESTING ONLY — do not commit. Lets `wrangler dev --remote` use the real
# bucket. Remove before pushing.
# preview_bucket_name = "sa-source-files"

# Private bucket for built front-end apps (super-admin console now; platform/runtime later).
# Create with: wrangler r2 bucket create sa-frontend-builds
[[r2_buckets]]
binding = "FRONTEND_BUILDS"
bucket_name = "sa-frontend-builds"

# Per-org access-token signing secrets — see packages/api/PER-ORG-JWT-SECRETS-DESIGN.md.
# MUST be the same namespace in sa-api and sa-websocket: sa-api signs with it,
# sa-websocket verifies with it. Keys: org:<orgId>, org:__global.
[[kv_namespaces]]
binding = "JWT_SECRETS"
id = "1669d6442bf34757a223bd7d6548d14c"

[vars]
R2_PUBLIC_URL = "https://sa-assets.superatom.ai"
R2_SOURCE_FILES_BUCKET_NAME = "sa-source-files"
SUPERADMIN_HOST = "superadmin.superatom.ai"
# Installer host: curl -fsSL https://install.superatom.ai | sh (src/install)
INSTALL_HOST = "install.superatom.ai"
INSTALL_CODE_REPO = "superatomai/superatom-setup-code"
INSTALL_CODE_REF = "main"
INSTALL_SA_API_URL = "https://sa-api.superatom.ai"

# Per-user voice rate limit (docs/SPEECH-TO-TEXT-DESIGN.md §3.4). period must be 10 or 60.
[[unsafe.bindings]]
name = "SPEECH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

# Super-admin console login throttle, per IP and per IP+email.
[[unsafe.bindings]]
name = "SUPERADMIN_LOGIN_LIMITER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

# Installer (redeem / update / code download) throttle, per IP.
[[unsafe.bindings]]
name = "INSTALL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "2004"
simple = { limit = 20, period = 60 }

# Per-project LLM proxy keys are created through the llm-proxy worker's admin API.
[[services]]
binding = "LLM_PROXY"
service = "llm-proxy"

# Environment variables (set via wrangler secret or dashboard)
# These should be set as secrets, not in this file:
#   wrangler secret put DATABASE_URL
#   wrangler secret put JWT_SECRET
#   wrangler secret put R2_ACCOUNT_ID            # Cloudflare account id, used to derive R2 S3 endpoint
#   wrangler secret put R2_ACCESS_KEY_ID         # R2 API token (S3-compatible) — for presigning multipart URLs
#   wrangler secret put R2_SECRET_ACCESS_KEY     # R2 API token secret
#   wrangler secret put SA_INTERNAL_SERVICE_TOKEN # shared secret for backend → worker calls (e.g. /signed-get)
#   wrangler secret put OPENROUTER_API_KEY       # voice transcription
#   wrangler secret put SUPERADMIN_JWT_SECRET    # super-admin console sessions; ≥32 chars, NOT the same as JWT_SECRET
#   wrangler secret put GITHUB_CODE_TOKEN        # installer: fine-grained PAT, superatom-setup-code only, Contents read-only
#   wrangler secret put INSTALL_DOWNLOAD_SECRET  # installer: signs code download links; ≥32 random chars
#   wrangler secret put LLM_PROXY_ADMIN_SECRET   # installer: the llm-proxy worker's ADMIN_SECRET
#   wrangler secret put RESEND_API_KEY           # installer: handed to new installs (report/alert emails)
#
# DATABASE_URL: Prod Neon PostgreSQL connection string
# JWT_SECRET: Secret key for signing/verifying JWTs
