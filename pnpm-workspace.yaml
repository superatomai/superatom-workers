packages:
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
ignoredBuiltDependencies:
  - esbuild
  - sharp
  - workerd
minimumReleaseAgeExclude:
  - hono@4.13.5
# pnpm 10+ reads dependency overrides from here (the "pnpm.overrides" field in
# package.json is ignored). These pin transitive deps pulled in by wrangler's
# local dev toolchain (miniflare/unenv/drizzle-kit/tsx) past known CVEs.
overrides:
  esbuild: ^0.28.1
  # >=6.29.1 fixes GHSA-xjj6-f33q-929c and GHSA-4qv8-2p9j-2685 on the 6.x line miniflare 3 uses
  undici: ^6.29.1
  ws: ^8.21.0
  defu: ^6.1.5
  sharp: ^0.35.5
  shell-quote: ^1.11.0
